<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chuyến xe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Danh sách chuyến xe</h2>
        <a class="btn btn-primary" th:href="@{/admin/trips/create}">Thêm mới</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 60px;">STT</th>
                        <th>Tuyến đường</th>
                        <th>Xe (biển số)</th>
                        <th>Khởi hành</th>
                        <th>Đến nơi</th>
                        <th>Giá vé</th>
                        <th style="width: 120px;">Trạng thái</th>
                        <th style="width: 260px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${trips.content.isEmpty()}">
                        <td colspan="8" class="text-center text-muted">Chưa có dữ liệu chuyến xe.</td>
                    </tr>
                    <tr th:each="trip, iterStat : ${trips.content}">
                        <td th:text="${trips.number * trips.size + iterStat.count}">1</td>
                        <td th:text="${routeNameById[trip.routeId]}">Hà Nội - TP.HCM</td>
                        <td th:text="${busNameById[trip.busId]}">30A-12345</td>
                        <td th:text="${#temporals.format(trip.departureTime, 'dd/MM/yyyy HH:mm')}">01/01/2024 08:00</td>
                        <td th:text="${#temporals.format(trip.arrivalTime, 'dd/MM/yyyy HH:mm')}">01/01/2024 20:00</td>
                        <td th:text="${#numbers.formatDecimal(trip.ticketPrice, 0, 'COMMA', 0, 'POINT')}">500.000</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${trip.status.name() == 'SCHEDULED' ? ' badge-success' : (trip.status.name() == 'DEPARTED' ? ' bg-info' : (trip.status.name() == 'COMPLETED' ? ' bg-secondary' : ' bg-danger'))}"
                                  th:text="${trip.status}">SCHEDULED</span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{|/admin/trips/${trip.id}/edit|}">Sửa</a>
                                <form th:action="@{|/admin/trips/${trip.id}/delete|}" method="post"
                                      onsubmit="return confirm('Bạn có chắc chắn muốn xóa chuyến xe này?');">
                                    <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                                </form>
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{|/admin/trips/${trip.id}/seats|}">Quản lý ghế</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${trips.totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${trips.first} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/trips(page=${trips.number - 1},size=${trips.size})}">Trước</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, trips.totalPages - 1)}"
                th:classappend="${pageNumber == trips.number} ? ' active'">
                <a class="page-link"
                   th:href="@{/admin/trips(page=${pageNumber},size=${trips.size})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${trips.last} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/trips(page=${trips.number + 1},size=${trips.size})}">Sau</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
