<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tripForm.id == null} ? 'Thêm chuyến xe mới' : 'Cập nhật chuyến xe'">Thêm chuyến xe mới</title>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    </th:block>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <h2 class="h5 mb-3" th:text="${tripForm.id == null} ? 'Thêm chuyến xe mới' : 'Cập nhật chuyến xe'">Thêm chuyến xe mới</h2>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:object="${tripForm}"
                  method="post"
                  th:action="${tripForm.id == null} ? @{/admin/trips/create} : @{|/admin/trips/${tripForm.id}/edit|}"
                  class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label for="routeId" class="form-label">Tuyến đường</label>
                    <select id="routeId" th:field="*{routeId}" class="form-select">
                        <option value="">-- Chọn tuyến đường --</option>
                        <option th:each="route : ${routes}"
                                th:value="${route['id']}"
                                th:text="${route['name']}">
                        </option>
                    </select>
                    <p class="validation-error" th:if="${#fields.hasErrors('routeId')}" th:errors="*{routeId}"></p>
                </div>

                <div class="col-md-6">
                    <label for="busId" class="form-label">Xe</label>
                    <select id="busId" th:field="*{busId}" class="form-select">
                        <option value="">-- Chọn xe --</option>
                        <option th:each="bus : ${buses}"
                                th:value="${bus.id}"
                                th:text="${bus.licensePlate}">
                        </option>
                    </select>
                    <p class="validation-error" th:if="${#fields.hasErrors('busId')}" th:errors="*{busId}"></p>
                </div>

                <div class="col-md-6">
                    <label for="departureTime" class="form-label">Thời gian khởi hành (dd/MM/yyyy HH:mm)</label>
                    <input id="departureTime" type="text" name="departureTime" class="form-control flatpickr-input"
                           th:value="${tripForm.departureTime != null ? #temporals.format(tripForm.departureTime, 'dd/MM/yyyy HH:mm') : ''}"
                           placeholder="dd/MM/yyyy HH:mm" autocomplete="off">
                    <p class="validation-error" th:if="${#fields.hasErrors('departureTime')}" th:errors="*{departureTime}"></p>
                </div>

                <div class="col-md-6">
                    <label for="arrivalTime" class="form-label">Thời gian đến (dd/MM/yyyy HH:mm)</label>
                    <input id="arrivalTime" type="text" name="arrivalTime" class="form-control flatpickr-input"
                           th:value="${tripForm.arrivalTime != null ? #temporals.format(tripForm.arrivalTime, 'dd/MM/yyyy HH:mm') : ''}"
                           placeholder="dd/MM/yyyy HH:mm" autocomplete="off">
                    <p class="validation-error" th:if="${#fields.hasErrors('arrivalTime')}" th:errors="*{arrivalTime}"></p>
                </div>

                <div class="col-md-6">
                    <label for="ticketPrice" class="form-label">Giá vé (VND)</label>
                    <input id="ticketPrice" type="number" min="1000" max="99999999" th:field="*{ticketPrice}" class="form-control">
                    <p class="validation-error" th:if="${#fields.hasErrors('ticketPrice')}" th:errors="*{ticketPrice}"></p>
                </div>

                <div class="col-md-6">
                    <label for="status" class="form-label">Trạng thái</label>
                    <select id="status" th:field="*{status}" class="form-select">
                        <option value="">-- Chọn trạng thái --</option>
                        <option th:each="status : ${tripStatuses}"
                                th:value="${status}"
                                th:text="${status}">
                        </option>
                    </select>
                    <p class="validation-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></p>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${tripForm.id == null} ? 'Tạo mới' : 'Cập nhật'">Tạo mới</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/trips}">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</section>

<th:block layout:fragment="pageScripts">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        flatpickr("#departureTime", {
            enableTime: true,
            time_24hr: true,
            dateFormat: "d/m/Y H:i",
            allowInput: true
        });
        flatpickr("#arrivalTime", {
            enableTime: true,
            time_24hr: true,
            dateFormat: "d/m/Y H:i",
            allowInput: true
        });
    </script>
</th:block>
</body>
</html>
