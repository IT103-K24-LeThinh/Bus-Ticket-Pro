<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Danh sách người dùng</h2>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 60px;">STT</th>
                        <th>Username</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>SĐT</th>
                        <th style="width: 110px;">Role</th>
                        <th style="width: 110px;">Trạng thái</th>
                        <th style="width: 250px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${users.content.isEmpty()}">
                        <td colspan="8" class="text-center text-muted">Chưa có người dùng.</td>
                    </tr>
                    <tr th:each="user, iterStat : ${users.content}">
                        <td th:text="${users.number * users.size + iterStat.count}">1</td>
                        <td th:text="${user.username}">admin</td>
                        <td th:text="${user.fullName}">Nguyễn Văn A</td>
                        <td th:text="${user.email}">a@b.com</td>
                        <td th:text="${user.phone}">0900000000</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${user.role.name() == 'ADMIN' ? ' bg-danger' : (user.role.name() == 'STAFF' ? ' bg-info' : ' bg-secondary')}"
                                  th:text="${user.role}">PASSENGER</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${user.active ? ' badge-success' : ' badge-inactive'}"
                                  th:text="${user.active ? 'Hoạt động' : 'Bị khóa'}">Hoạt động</span>
                        </td>
                        <td>
                            <div class="d-flex gap-2 flex-wrap">
                                <!-- Toggle active -->
                                <form th:action="@{|/admin/users/${user.id}/toggle-active|}" method="post">
                                    <button type="submit"
                                            class="btn btn-sm"
                                            th:classappend="${user.active ? ' btn-warning' : ' btn-success'}"
                                            th:text="${user.active ? 'Khóa' : 'Mở khóa'}"
                                            th:disabled="${user.role.name() == 'ADMIN'}"
                                            onclick="return confirm('Bạn có chắc?')">
                                        Khóa
                                    </button>
                                </form>
                                <!-- Change role (only for non-ADMIN users) -->
                                <form th:if="${user.role.name() != 'ADMIN'}"
                                      th:action="@{|/admin/users/${user.id}/change-role|}" method="post"
                                      class="d-flex gap-1">
                                    <select name="role" class="form-select form-select-sm" style="width: auto;">
                                        <option value="PASSENGER" th:selected="${user.role.name() == 'PASSENGER'}">PASSENGER</option>
                                        <option value="STAFF" th:selected="${user.role.name() == 'STAFF'}">STAFF</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-outline-primary">Đổi</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${users.totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${users.first} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/users(page=${users.number - 1},size=${users.size})}">Trước</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, users.totalPages - 1)}"
                th:classappend="${pageNumber == users.number} ? ' active'">
                <a class="page-link"
                   th:href="@{/admin/users(page=${pageNumber},size=${users.size})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${users.last} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/users(page=${users.number + 1},size=${users.size})}">Sau</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
