<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${busForm.id == null} ? 'Thêm xe mới' : 'Cập nhật xe'">Thêm xe mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <h2 class="h5 mb-3" th:text="${busForm.id == null} ? 'Thêm xe mới' : 'Cập nhật thông tin xe'">Thêm xe mới</h2>

            <form th:object="${busForm}"
                  method="post"
                  th:action="${busForm.id == null} ? @{/admin/buses/create} : @{|/admin/buses/${busForm.id}/edit|}"
                  class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label for="licensePlate" class="form-label">Biển số xe</label>
                    <input id="licensePlate" type="text" th:field="*{licensePlate}" class="form-control">
                    <p class="validation-error" th:if="${#fields.hasErrors('licensePlate')}" th:errors="*{licensePlate}"></p>
                </div>

                <div class="col-md-6">
                    <label for="busType" class="form-label">Loại xe</label>
                    <select id="busType" th:field="*{busType}" class="form-select">
                        <option value="">-- Chọn loại xe --</option>
                        <option th:each="type : ${busTypes}"
                                th:value="${type}"
                                th:text="${type == T(com.re.busticket.entity.enums.BusType).SEATS_29 ? 'Ghế ngồi 29 chỗ' : 'Ghế ngồi 45 chỗ'}">
                        </option>
                    </select>
                    <p class="validation-error" th:if="${#fields.hasErrors('busType')}" th:errors="*{busType}"></p>
                </div>

                <div class="col-md-6">
                    <label for="totalSeats" class="form-label">Tổng số ghế</label>
                    <input id="totalSeats" type="number" min="1" th:field="*{totalSeats}" class="form-control">
                    <p class="validation-error" th:if="${#fields.hasErrors('totalSeats')}" th:errors="*{totalSeats}"></p>
                </div>

                <div class="col-md-6">
                    <label for="companyName" class="form-label">Hãng xe</label>
                    <input id="companyName" type="text" th:field="*{companyName}" class="form-control">
                    <p class="validation-error" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></p>
                </div>

                <div class="col-md-6">
                    <label for="driverName" class="form-label">Tài xế</label>
                    <select id="driverName" th:field="*{driverName}" class="form-select">
                        <option value="">-- Chọn tài xế --</option>
                        <option th:each="driver : ${drivers}" th:value="${driver.fullName}" th:text="${driver.fullName}"></option>
                    </select>
                    <p class="validation-error" th:if="${#fields.hasErrors('driverName')}" th:errors="*{driverName}"></p>
                </div>

                <div class="col-md-6 d-flex align-items-center">
                    <div class="form-check mt-4">
                        <input id="isActive" class="form-check-input" type="checkbox" th:field="*{isActive}">
                        <label class="form-check-label" for="isActive">Xe đang hoạt động</label>
                    </div>
                    <p class="validation-error" th:if="${#fields.hasErrors('isActive')}" th:errors="*{isActive}"></p>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${busForm.id == null} ? 'Tạo mới' : 'Cập nhật'">Tạo mới</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/buses}">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
