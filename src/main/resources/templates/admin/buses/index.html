<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý xe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Danh sách xe</h2>
        <a class="btn btn-primary" th:href="@{/admin/buses/create}">Thêm xe mới</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-warning" th:if="${warningMessage}" th:text="${warningMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 60px;">STT</th>
                        <th>Biển số</th>
                        <th>Loại xe</th>
                        <th>Số ghế</th>
                        <th>Hãng xe</th>
                        <th>Tài xế</th>
                        <th style="width: 130px;">Trạng thái</th>
                        <th style="width: 190px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${buses.content.isEmpty()}">
                        <td colspan="8" class="text-center text-muted">Chưa có dữ liệu xe.</td>
                    </tr>
                    <tr th:each="bus, iterStat : ${buses.content}">
                        <td th:text="${buses.number * buses.size + iterStat.count}">1</td>
                        <td th:text="${bus.licensePlate}">30A-12345</td>
                        <td th:text="${bus.busType == T(com.re.busticket.entity.enums.BusType).SEATS_29 ? 'Ghế ngồi 29 chỗ' : 'Ghế ngồi 45 chỗ'}">Ghế ngồi 45 chỗ</td>
                        <td th:text="${bus.totalSeats}">45</td>
                        <td th:text="${bus.companyName}">Bus Ticket</td>
                        <td th:text="${bus.driverName}">Nguyễn Văn A</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${bus.isActive} ? ' badge-success' : ' badge-inactive'"
                                  th:text="${bus.isActive} ? 'Hoạt động' : 'Ngừng hoạt động'">Hoạt động</span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{|/admin/buses/${bus.id}/edit|}">Sửa</a>
                                <form th:action="@{|/admin/buses/${bus.id}/deactivate|}" method="post">
                                    <button type="submit"
                                            class="btn btn-sm btn-secondary"
                                            th:disabled="${!bus.isActive}">
                                        Ngừng hoạt động
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${buses.totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${buses.first} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/buses(page=${buses.number - 1},size=${buses.size})}">Trước</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, buses.totalPages - 1)}"
                th:classappend="${pageNumber == buses.number} ? ' active'">
                <a class="page-link"
                   th:href="@{/admin/buses(page=${pageNumber},size=${buses.size})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${buses.last} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/buses(page=${buses.number + 1},size=${buses.size})}">Sau</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
