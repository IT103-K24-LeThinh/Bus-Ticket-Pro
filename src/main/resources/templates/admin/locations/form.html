<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${locationForm.id == null} ? 'Thêm tỉnh thành mới' : 'Cập nhật tỉnh thành'">Thêm tỉnh thành mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <h2 class="h5 mb-3" th:text="${locationForm.id == null} ? 'Thêm tỉnh thành mới' : 'Cập nhật tỉnh thành'">Thêm tỉnh thành mới</h2>

            <form th:object="${locationForm}"
                  method="post"
                  th:action="${locationForm.id == null} ? @{/admin/locations/create} : @{|/admin/locations/${locationForm.id}/edit|}"
                  class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label for="name" class="form-label">Tên tỉnh thành</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control">
                    <p class="validation-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${locationForm.id == null} ? 'Tạo mới' : 'Cập nhật'">Tạo mới</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/locations}">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
