<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục tỉnh thành</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Danh sách tỉnh thành</h2>
        <a class="btn btn-primary" th:href="@{/admin/locations/create}">Thêm mới</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 60px;">STT</th>
                        <th>Tên tỉnh thành</th>
                        <th style="width: 220px;">Ngày tạo</th>
                        <th style="width: 190px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${locations.content.isEmpty()}">
                        <td colspan="4" class="text-center text-muted">Chưa có dữ liệu tỉnh thành.</td>
                    </tr>
                    <tr th:each="location, iterStat : ${locations.content}">
                        <td th:text="${locations.number * locations.size + iterStat.count}">1</td>
                        <td th:text="${location.name}">Hà Nội</td>
                        <td th:text="${location.createdAt != null ? #temporals.format(location.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                        <td>
                            <div class="d-flex gap-2">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{|/admin/locations/${location.id}/edit|}">Sửa</a>
                                <form th:action="@{|/admin/locations/${location.id}/delete|}" method="post"
                                      style="display:inline;">
                                    <button type="submit"
                                            class="btn btn-sm btn-danger"
                                            onclick="return confirm('Bạn có chắc muốn xóa?')">
                                        Xóa
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${locations.totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${locations.first} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/locations(page=${locations.number - 1},size=${locations.size})}">Trước</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, locations.totalPages - 1)}"
                th:classappend="${pageNumber == locations.number} ? ' active'">
                <a class="page-link"
                   th:href="@{/admin/locations(page=${pageNumber},size=${locations.size})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${locations.last} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/locations(page=${locations.number + 1},size=${locations.size})}">Sau</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
