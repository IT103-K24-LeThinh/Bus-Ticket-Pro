<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <p class="card-title">Tổng số xe</p>
                    <p class="card-value" th:text="${totalBuses}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <p class="card-title">Tổng số tuyến đường</p>
                    <p class="card-value" th:text="${totalRoutes}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <p class="card-title">Tổng số điểm đến</p>
                    <p class="card-value" th:text="${totalLocations}">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Biểu đồ trạng thái xe</h2>
                    <canvas id="busStatusChart" height="120"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5 mb-3">Truy cập nhanh</h2>
                    <div class="d-grid gap-2">
                        <a class="btn btn-primary" th:href="@{/admin/buses}">Quản lý xe</a>
                        <a class="btn btn-secondary" th:href="@{/admin/routes}">Xem tuyến đường</a>
                        <a class="btn btn-secondary" th:href="@{/admin/locations}">Xem tỉnh thành</a>
                        <a class="btn btn-secondary" th:href="@{/admin/drivers}">Xem tài xế</a>
                        <a class="btn btn-secondary" th:href="@{/admin/trips}">Xem chuyến đi</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<th:block layout:fragment="pageScripts">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        const chartElement = document.getElementById("busStatusChart");
        if (chartElement) {
            const activeBuses = /*[[${activeBuses}]]*/ 0;
            const inactiveBuses = /*[[${inactiveBuses}]]*/ 0;

            new Chart(chartElement, {
                type: "bar",
                data: {
                    labels: ["Đang hoạt động", "Ngừng hoạt động"],
                    datasets: [{
                        data: [activeBuses, inactiveBuses],
                        backgroundColor: ["#66BB6A", "#EF5350"],
                        borderColor: ["#66BB6A", "#EF5350"],
                        borderWidth: 1
                    }]
                },
                options: {
                    plugins: {
                        legend: {display: false}
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    }
                }
            });
        }
    </script>
</th:block>
</body>
</html>
