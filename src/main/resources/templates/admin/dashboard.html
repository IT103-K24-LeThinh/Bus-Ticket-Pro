<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <p class="card-title">Tổng số xe</p>
                    <p class="card-value" th:text="${totalBuses}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <p class="card-title">Tổng số tuyến đường</p>
                    <p class="card-value" th:text="${totalRoutes}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <p class="card-title">Tổng số chuyến xe</p>
                    <p class="card-value" th:text="${totalTrips}">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Trạng thái xe</h2>
                    <canvas id="busStatusChart" height="200"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Tổng quan hệ thống</h2>
                    <canvas id="overviewChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>
</section>

<th:block layout:fragment="pageScripts">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        var activeBuses = /*[[${activeBuses}]]*/ 0;
        var inactiveBuses = /*[[${inactiveBuses}]]*/ 0;
        var totalBuses = /*[[${totalBuses}]]*/ 0;
        var totalRoutes = /*[[${totalRoutes}]]*/ 0;
        var totalTrips = /*[[${totalTrips}]]*/ 0;

        new Chart(document.getElementById('busStatusChart'), {
            type: 'doughnut',
            data: {
                labels: ['Đang hoạt động', 'Ngừng hoạt động'],
                datasets: [{
                    data: [activeBuses, inactiveBuses],
                    backgroundColor: ['#66BB6A', '#EF5350']
                }]
            },
            options: {
                plugins: { legend: { position: 'bottom' } }
            }
        });

        new Chart(document.getElementById('overviewChart'), {
            type: 'bar',
            data: {
                labels: ['Xe', 'Tuyến đường', 'Chuyến xe'],
                datasets: [{
                    label: 'Số lượng',
                    data: [totalBuses, totalRoutes, totalTrips],
                    backgroundColor: ['#4CAF50', '#2196F3', '#FF9800']
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
            }
        });
    </script>
</th:block>
</body>
</html>
