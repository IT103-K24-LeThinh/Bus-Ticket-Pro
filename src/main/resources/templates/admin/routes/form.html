<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${routeForm.id == null} ? 'Thêm tuyến đường mới' : 'Cập nhật tuyến đường'">Thêm tuyến đường mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <h2 class="h5 mb-3" th:text="${routeForm.id == null} ? 'Thêm tuyến đường mới' : 'Cập nhật tuyến đường'">Thêm tuyến đường mới</h2>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:object="${routeForm}"
                  method="post"
                  th:action="${routeForm.id == null} ? @{/admin/routes/create} : @{|/admin/routes/${routeForm.id}/edit|}"
                  class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label for="departureLocationId" class="form-label">Điểm đi</label>
                    <select id="departureLocationId" th:field="*{departureLocationId}" class="form-select">
                        <option value="">-- Chọn điểm đi --</option>
                        <option th:each="location : ${locations}"
                                th:value="${location.id}"
                                th:text="${location.name}">
                        </option>
                    </select>
                    <p class="validation-error" th:if="${#fields.hasErrors('departureLocationId')}" th:errors="*{departureLocationId}"></p>
                </div>

                <div class="col-md-6">
                    <label for="arrivalLocationId" class="form-label">Điểm đến</label>
                    <select id="arrivalLocationId" th:field="*{arrivalLocationId}" class="form-select">
                        <option value="">-- Chọn điểm đến --</option>
                        <option th:each="location : ${locations}"
                                th:value="${location.id}"
                                th:text="${location.name}">
                        </option>
                    </select>
                    <p class="validation-error" th:if="${#fields.hasErrors('arrivalLocationId')}" th:errors="*{arrivalLocationId}"></p>
                </div>

                <div class="col-md-6">
                    <label for="distanceKm" class="form-label">Khoảng cách (km)</label>
                    <input id="distanceKm" type="number" min="1" max="9999" step="0.1" th:field="*{distanceKm}" class="form-control">
                    <p class="validation-error" th:if="${#fields.hasErrors('distanceKm')}" th:errors="*{distanceKm}"></p>
                </div>

                <div class="col-md-6">
                    <label for="estimatedDurationMinutes" class="form-label">Thời gian ước tính (phút)</label>
                    <input id="estimatedDurationMinutes" type="number" min="1" max="99999" th:field="*{estimatedDurationMinutes}" class="form-control">
                    <p class="validation-error" th:if="${#fields.hasErrors('estimatedDurationMinutes')}" th:errors="*{estimatedDurationMinutes}"></p>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${routeForm.id == null} ? 'Tạo mới' : 'Cập nhật'">Tạo mới</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/routes}">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
