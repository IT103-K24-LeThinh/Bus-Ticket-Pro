<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục tuyến đường</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Danh sách tuyến đường</h2>
        <a class="btn btn-primary" th:href="@{/admin/routes/create}">Thêm mới</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 60px;">STT</th>
                        <th>Điểm đi</th>
                        <th>Điểm đến</th>
                        <th style="width: 150px;">Khoảng cách (km)</th>
                        <th style="width: 170px;">Thời gian (phút)</th>
                        <th style="width: 190px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${routes.content.isEmpty()}">
                        <td colspan="6" class="text-center text-muted">Chưa có dữ liệu tuyến đường.</td>
                    </tr>
                    <tr th:each="route, iterStat : ${routes.content}">
                        <td th:text="${routes.number * routes.size + iterStat.count}">1</td>
                        <td th:text="${locationNameById[route.departureLocationId]} ?: 'Không xác định'">Hà Nội</td>
                        <td th:text="${locationNameById[route.arrivalLocationId]} ?: 'Không xác định'">Hải Phòng</td>
                        <td th:text="${route.distanceKm}">0</td>
                        <td th:text="${route.estimatedDurationMinutes}">0</td>
                        <td>
                            <div class="d-flex gap-2">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{|/admin/routes/${route.id}/edit|}">Sửa</a>
                                <form th:action="@{|/admin/routes/${route.id}/delete|}" method="post"
                                      onsubmit="return confirm('Bạn có chắc chắn muốn xóa tuyến đường này?');">
                                    <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${routes.totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${routes.first} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/routes(page=${routes.number - 1},size=${routes.size})}">Trước</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, routes.totalPages - 1)}"
                th:classappend="${pageNumber == routes.number} ? ' active'">
                <a class="page-link"
                   th:href="@{/admin/routes(page=${pageNumber},size=${routes.size})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${routes.last} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/routes(page=${routes.number + 1},size=${routes.size})}">Sau</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
