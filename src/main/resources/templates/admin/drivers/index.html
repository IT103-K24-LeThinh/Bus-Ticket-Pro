<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục tài xế</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <h2 class="h5 mb-3">Danh sách tài xế (Mock data)</h2>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 60px;">STT</th>
                        <th>Họ tên tài xế</th>
                        <th>Số GPLX</th>
                        <th>Số điện thoại</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${drivers.content.isEmpty()}">
                        <td colspan="4" class="text-center text-muted">Chưa có dữ liệu tài xế.</td>
                    </tr>
                    <tr th:each="driver, iterStat : ${drivers.content}">
                        <td th:text="${drivers.number * drivers.size + iterStat.count}">1</td>
                        <td th:text="${driver.fullName}">Nguyễn Văn A</td>
                        <td th:text="${driver.licenseNumber}">FC-001</td>
                        <td th:text="${driver.phone}">0900000000</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${drivers.totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${drivers.first} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/drivers(page=${drivers.number - 1},size=${drivers.size})}">Trước</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, drivers.totalPages - 1)}"
                th:classappend="${pageNumber == drivers.number} ? ' active'">
                <a class="page-link"
                   th:href="@{/admin/drivers(page=${pageNumber},size=${drivers.size})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${drivers.last} ? ' disabled'">
                <a class="page-link" th:href="@{/admin/drivers(page=${drivers.number + 1},size=${drivers.size})}">Sau</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
