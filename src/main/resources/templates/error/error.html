<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Lỗi hệ thống</title>
</head>
<body>
<section layout:fragment="content" class="error-section">
    <div class="error-card">
        <p class="error-code" th:text="${statusCode}">500</p>
        <h1>Đã xảy ra lỗi ngoài mong muốn</h1>
        <p class="error-description">Hệ thống gặp lỗi trong quá trình xử lý yêu cầu. Vui lòng thử lại.</p>
        <div class="error-actions">
            <a class="btn-link-primary" th:href="@{/}">Về trang chính</a>
            <a class="btn-link-secondary" th:href="@{/login}">Đăng nhập</a>
        </div>
    </div>
</section>
</body>
</html>
