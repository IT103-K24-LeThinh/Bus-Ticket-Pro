<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/passenger}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Lịch sử đặt vé</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0" th:text="${pageTitle}">Lịch sử đặt vé</h2>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card mb-3">
        <div class="card-body">
            <form method="get" th:action="@{/passenger/booking/history}" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label for="status" class="form-label mb-1">Trạng thái</label>
                    <select id="status" name="status" class="form-select">
                        <option value="" th:selected="${filterStatus == null}">Tất cả</option>
                        <option value="PENDING"
                                th:selected="${filterStatus != null and filterStatus.name() == 'PENDING'}">
                            Chờ xử lý
                        </option>
                        <option value="CONFIRMED"
                                th:selected="${filterStatus != null and filterStatus.name() == 'CONFIRMED'}">
                            Đã xác nhận
                        </option>
                        <option value="CANCELLED"
                                th:selected="${filterStatus != null and filterStatus.name() == 'CANCELLED'}">
                            Đã huỷ
                        </option>
                    </select>
                </div>
                <div class="col-md-auto">
                    <button type="submit" class="btn btn-primary">Lọc</button>
                    <a th:href="@{/passenger/booking/history}" class="btn btn-outline-secondary">Đặt lại</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 110px;">Mã vé</th>
                        <th>Tuyến</th>
                        <th style="width: 160px;">Khởi hành</th>
                        <th style="width: 90px;">Số ghế</th>
                        <th style="width: 140px;">Số tiền</th>
                        <th style="width: 130px;">Phương thức</th>
                        <th style="width: 130px;">Trạng thái</th>
                        <th style="width: 200px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${bookings.content.isEmpty()}">
                        <td colspan="8" class="text-center text-muted">Bạn chưa có vé nào.</td>
                    </tr>
                    <tr th:each="booking : ${bookings.content}">
                        <td>
                            <span class="badge bg-primary"
                                  th:text="${bookingReferenceMap[booking.id]}">BK-0</span>
                        </td>
                        <td th:text="${tripRouteName[booking.tripId]} ?: 'N/A'">Hà Nội → Hải Phòng</td>
                        <td>
                            <span th:if="${tripDepartureTime[booking.tripId] != null}"
                                  th:text="${#temporals.format(tripDepartureTime[booking.tripId], 'dd/MM/yyyy HH:mm')}">
                                --/--/---- --:--
                            </span>
                            <span th:unless="${tripDepartureTime[booking.tripId] != null}" class="text-muted">N/A</span>
                        </td>
                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${seatNumberById[booking.seatId]} ?: 'N/A'">A1</span>
                        </td>
                        <td th:text="${#numbers.formatInteger(booking.paymentAmount, 0, 'POINT') + ' VND'}">0 VND</td>
                        <td th:text="${paymentMethodLabels.get(booking.paymentMethod.name())}">Tiền mặt</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${booking.bookingStatus.name() == 'CONFIRMED'} ? ' bg-success'
                                                  : (${booking.bookingStatus.name() == 'PENDING'} ? ' bg-warning text-dark' : ' bg-secondary')"
                                  th:text="${bookingStatusLabels.get(booking.bookingStatus.name())}">Trạng thái</span>
                        </td>
                        <td>
                            <div class="d-flex gap-2 flex-wrap">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{|/passenger/booking/${booking.id}|}">Chi tiết</a>
                                <form th:if="${cancellableMap[booking.id]}"
                                      method="post"
                                      th:action="@{|/passenger/booking/${booking.id}/cancel|}"
                                      onsubmit="return confirm('Bạn có chắc muốn huỷ vé này không?');"
                                      class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger">Huỷ vé</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${bookings.totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${bookings.first} ? ' disabled'">
                <a class="page-link"
                   th:href="@{/passenger/booking/history(page=${bookings.number - 1},size=${bookings.size},status=${filterStatus != null ? filterStatus.name() : null})}">Trước</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, bookings.totalPages - 1)}"
                th:classappend="${pageNumber == bookings.number} ? ' active'">
                <a class="page-link"
                   th:href="@{/passenger/booking/history(page=${pageNumber},size=${bookings.size},status=${filterStatus != null ? filterStatus.name() : null})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${bookings.last} ? ' disabled'">
                <a class="page-link"
                   th:href="@{/passenger/booking/history(page=${bookings.number + 1},size=${bookings.size},status=${filterStatus != null ? filterStatus.name() : null})}">Sau</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
