<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Hành khách - Bus Ticket Pro">Hành khách - Bus Ticket Pro</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/passenger.css}">
    <th:block layout:fragment="pageStyles"></th:block>
</head>
<body class="passenger-body">
<div class="passenger-shell">
    <aside th:replace="~{fragment/passenger-sidebar :: passengerSidebar}"></aside>

    <div class="passenger-main">
        <header th:replace="~{fragment/passenger-header :: passengerHeader}"></header>

        <main class="passenger-content container-fluid" layout:fragment="content">
            <h1 class="page-title">Trang hành khách</h1>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<th:block layout:fragment="pageScripts"></th:block>
</body>
</html>
