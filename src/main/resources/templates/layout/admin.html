<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Admin - Bus Ticket Pro">Admin - Bus Ticket Pro</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <th:block layout:fragment="pageStyles"></th:block>
</head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragment/admin-sidebar :: adminSidebar}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragment/admin-header :: adminHeader}"></header>

        <main class="admin-content container-fluid" layout:fragment="content">
            <h1 class="page-title">Quản trị hệ thống</h1>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<th:block layout:fragment="pageScripts"></th:block>
</body>
</html>
